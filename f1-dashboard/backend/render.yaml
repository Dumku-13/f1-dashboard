# Render blueprint for the FastAPI backend.
#
# Point Render at this file (Blueprint → connect the repo) or copy the settings
# into a Web Service by hand. Either way the two things that matter are the root
# directory and the $PORT bind.
#
# WHY A PERSISTENT DISK: fastf1 caches raw session telemetry, and the local dev
# cache is ~3.1GB. It is gitignored and does not ship. Without a disk the
# service re-downloads per session on every cold start, which turns a telemetry
# or track-outline request into a 30-90s wait instead of a fast one. The app
# still WORKS without it — it is a speed problem, not a correctness one — so if
# a disk isn't available, deploy anyway and expect slow first loads.
services:
  - type: web
    name: f1-dashboard-api
    runtime: python
    # The backend is not at the repo root.
    rootDir: f1-dashboard/backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT; binding to a fixed 8000 makes the service
    # unreachable and the failure looks like a timeout, not a config error.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      # Where fastf1 caches. Must sit on the mounted disk below.
      - key: FASTF1_CACHE
        value: /var/data/fastf1
      # Only needed if anything calls this API cross-origin. The frontend
      # proxies /api/* server-side, so normally it does not.
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional — the AI race engineer degrades to a rule-based answer without
      # either of these, and the page still works.
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: fastf1-cache
      mountPath: /var/data
      sizeGB: 10
